defaults:
    - _self_
    - agent: sac

algo_name: sac


# reward learning
segment: 50
activation: tanh
num_seed_steps: 1000
num_unsup_steps: 5000
num_interact: 5000
reward_lr: 0.0003
reward_batch: 128
reward_update: 200
feed_type: 0
reset_update: 100
topK: 5
ensemble_size: 3
max_feedback: 1400
large_batch: 10
label_margin: 0.0
teacher_beta: -1
teacher_gamma: 1
teacher_eps_mistake: 0
teacher_eps_skip: 0
teacher_eps_equal: 0

# scheduling
reward_schedule: 0

num_train_steps: 1e6
replay_buffer_capacity: ${num_train_steps}

# evaluation config
eval_frequency: 10000
num_eval_episodes: 10
device: cuda

# logger
log_frequency: 10000
log_save_wandb: true

# video recorder
save_video: false

# wandb
run_group: ''
exp_name: ${run_group}_s${seed}
notes: ''
save_dir: './logs_metaworld/${env}'

# debug
debug: false

# setups
seed: 1

# Environment
env: metaworld_drawer-open-v2
gradient_update: 1

num_ratings: 2

# hydra configuration
hydra:
    output_subdir: null
    run:
        dir: ${save_dir}/${run_group}/${exp_name}